bus:
  interface: socketcan
  channel: can0

sender:
  bus_name: b_can
  dbc: ../A5.dbc
  output: logs/b_can_hazard_mutation_tx.jsonl

  # A5.dbc: Blinkmodi_02, standard ID 0x366, DLC 8.
  # live payload에서 BM_Warnblinken을 먼저 ON으로 patch한 뒤 그 payload를
  # 상위 저장소 src.mutation.mutator.Mutator의 seed로 사용합니다.
  message: Blinkmodi_02
  id: 0x366
  set:
    BM_Warnblinken: 1

  base:
    mode: live
    timeout_seconds: 5.0
    sample_count: 3
    min_mode_ratio: 1.0

  mutation:
    enabled: true
    max_operations: 3
    allow_dlc_change: false
    include_original: true
    # 같은 캠페인을 재현하려면 정수값으로 고정하십시오.
    random_seed: 366

  transmit:
    count: 256
    interval_ms: 10.0
    send_timeout_seconds: 1.0
    restore_original: true
    restore_count: 1
    restore_delay_ms: 100.0

  safety:
    max_count: 256
    min_interval_ms: 10.0
    allow_protected_dbc_patch: false
